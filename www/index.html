<style>
/* Layout: một cột dành cho điện thoại; tóm tắt lương ở đầu, danh sách ngày ở giữa, thanh tab cố định ở đáy. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#F5F6F8; --line:#DDE1E7;
  --ink:#14181F; --muted:#5E6875;
  --accent:#0E7C7B; --accent-ink:#FFFFFF; --accent-soft:#DDF0EF;
  --ot:#A3500A; --ot-soft:#FBEBD6;
  --off:#B42318; --off-soft:#FBE4E1;
  --sun:#F7F1EC;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1318; --surface:#171C22; --surface2:#1E242B; --line:#2B333C;
  --ink:#E7EAEE; --muted:#9AA5B1;
  --accent:#3DB5B2; --accent-ink:#06201F; --accent-soft:#12302F;
  --ot:#F0A64A; --ot-soft:#37270F;
  --off:#F07167; --off-soft:#3A1D1B;
  --sun:#1B1F25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#171C22; --surface2:#1E242B; --line:#2B333C;
  --ink:#E7EAEE; --muted:#9AA5B1;
  --accent:#3DB5B2; --accent-ink:#06201F; --accent-soft:#12302F;
  --ot:#F0A64A; --ot-soft:#37270F;
  --off:#F07167; --off-soft:#3A1D1B;
  --sun:#1B1F25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:8px}
.top .brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:1;min-width:0}
.nav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.nav button{border:0;background:transparent;width:38px;height:38px;border-radius:9px;font-size:20px;line-height:1;color:var(--ink)}
.nav button:hover{background:var(--surface2)}
.nav button:disabled{opacity:.3;cursor:default}
.hero .sub{font-size:13px;color:var(--muted)}
.tagk{color:var(--accent);font-weight:600}
.nav .cur{flex:1;text-align:center;font-weight:600;font-size:16px}
.nav .cur small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.hero .big{font-family:var(--mono);font-size:clamp(28px,9vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:600}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.ot b{color:var(--ot)} .stat.off b{color:var(--off)}
.hint{font-size:12.5px;color:var(--ot);background:var(--ot-soft);border-radius:8px;padding:7px 10px}

.bar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--off)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.sun{background:var(--sun)}
.row.today{box-shadow:inset 3px 0 0 var(--accent)}
.dnum{font-family:var(--mono);font-size:21px;font-weight:600;text-align:center;line-height:1}
.dmeta{min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:0;text-align:left;padding:0}
.dmeta .w{font-size:13.5px;font-weight:600}
.dmeta .l{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dmeta .n{font-size:12px;color:var(--ot);font-style:italic;overflow-wrap:anywhere}
.ctl{display:flex;align-items:center;gap:6px}
.step{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:18px;line-height:1;padding:0}
.hrs{width:62px;height:34px;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-family:var(--mono);font-size:16px;font-weight:500;padding:0 4px;-moz-appearance:textfield}
.hrs::-webkit-outer-spin-button,.hrs::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chip{grid-column:2 / 4;justify-self:start;margin-top:2px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.ot{background:var(--ot-soft);color:var(--ot)}
.chip.off{background:var(--off-soft);color:var(--off)}
.noteed{grid-column:1 / 4;margin-top:6px}
.noteed input{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 10px;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line)}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted);font-size:14px;min-width:0}
.kv span:last-child{font-family:var(--mono);font-size:14.5px;text-align:right;white-space:nowrap}
.kv small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font)}
.kv.total{border-top:2px solid var(--ink);margin-top:4px;padding-top:9px}
.kv.total span{color:var(--ink)!important;font-weight:600}

.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-size:11.5px;color:var(--muted);font-weight:600;border-top:0;background:var(--surface2);white-space:normal;vertical-align:bottom}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600}
th:first-child{background:var(--surface2)}
td{font-family:var(--mono)} td:first-child{font-family:var(--font)}
tr.cur td{background:var(--accent-soft)} tr.cur td:first-child{background:var(--accent-soft)}
tr.tot td{font-weight:600;border-top:2px solid var(--ink)}
td.dim{color:var(--muted);text-align:left;font-family:var(--font)}

.field{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-top:1px dashed var(--line)}
.field:first-of-type{border-top:0}
.field label{font-size:14px;font-weight:500}
.field small{color:var(--muted);font-size:12px}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:40px;padding:0 10px;font-family:var(--mono);font-size:16px;width:100%}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.status{font-size:12.5px;color:var(--muted)}
.status b{color:var(--accent)}
textarea.copybox{width:100%;height:110px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--ink);font-family:var(--mono);font-size:12px;padding:8px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.hero .big{transition:color .2s}}
</style>

<script>
/*CORE*/
const dim=(y,m)=>new Date(y,m,0).getDate();
const key=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const r2=x=>Math.round(x*100)/100;
/* Âm lịch Việt Nam (thuật toán Hồ Ngọc Đức, múi giờ +7) */
const PI=Math.PI,TZ=7;
function jdFromDate(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd;}
function newMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,dr=PI/180;let J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;J+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mp=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C-=0.4068*Math.sin(Mp*dr);C+=0.0161*Math.sin(dr*2*Mp);C-=0.0004*Math.sin(dr*3*Mp);C+=0.0104*Math.sin(dr*2*F);C-=0.0051*Math.sin(dr*(M+Mp));C-=0.0074*Math.sin(dr*(M-Mp));C+=0.0004*Math.sin(dr*(2*F+M));C-=0.0004*Math.sin(dr*(2*F-M));C-=0.0006*Math.sin(dr*(2*F+Mp));C+=0.0010*Math.sin(dr*(2*F-Mp));C+=0.0005*Math.sin(dr*(2*Mp+M));const dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;return J+C-dt;}
function sunLong(jdn){const T=(jdn-2451545.0)/36525,T2=T*T,dr=PI/180,M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL+=(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=(L0+DL)*dr;L-=PI*2*Math.floor(L/(PI*2));return L;}
const sunSign=d=>Math.floor(sunLong(d-0.5-TZ/24)/PI*6);
const nmDay=k=>Math.floor(newMoon(k)+0.5+TZ/24);
function lunarM11(yy){const off=jdFromDate(31,12,yy)-2415021,k=Math.floor(off/29.530588853);let nm=nmDay(k);if(sunSign(nm)>=9)nm=nmDay(k-1);return nm;}
function leapOff(a11){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last=0,i=1,arc=sunSign(nmDay(k+i));do{last=arc;i++;arc=sunSign(nmDay(k+i));}while(arc!=last&&i<14);return i-1;}
function solar2lunar(dd,mm,yy){
  const dn=jdFromDate(dd,mm,yy),k=Math.floor((dn-2415021.076998695)/29.530588853);
  let ms=nmDay(k+1);if(ms>dn)ms=nmDay(k);
  let a11=lunarM11(yy),b11=a11,ly;
  if(a11>=ms){ly=yy;a11=lunarM11(yy-1);}else{ly=yy+1;b11=lunarM11(yy+1);}
  const ld=dn-ms+1,diff=Math.floor((ms-a11)/29);let leap=0,lm=diff+11;
  if(b11-a11>365){const lo=leapOff(a11);if(diff>=lo){lm=diff+10;if(diff==lo)leap=1;}}
  if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;
  return {d:ld,m:lm,y:ly,leap};
}
function jdToDate(jd){let a,b,c;if(jd>2299160){a=jd+32044;b=Math.floor((4*a+3)/146097);c=a-Math.floor(b*146097/4);}else{b=0;c=jd+32082;}const d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);return {d:e-Math.floor((153*m+2)/5)+1,m:m+3-12*Math.floor(m/10),y:b*100+d-4800+Math.floor(m/10)};}
const kOfJd=jd=>Math.floor((jd-2415021.076998695)/29.530588853);
/* Kỳ lương: từ ngày âm lịch `cut` của một tháng âm đến trước ngày `cut` của tháng âm kế tiếp. k = số thứ tự tháng âm (theo trăng non). */
function periodInfo(k,cut){
  const ms=nmDay(k),me=nmDay(k+1),start=ms+cut-1,end=me+cut-1;
  const m1=jdToDate(ms),lu=solar2lunar(m1.d,m1.m,m1.y);
  return {k,start,end,n:end-start,sd:jdToDate(start),ed:jdToDate(end-1),lm:lu.m,leap:lu.leap,ly:lu.y};
}
function periodOfJd(jd,cut){const k=kOfJd(jd);for(let i=-2;i<=2;i++){const p=periodInfo(k+i,cut);if(jd>=p.start&&jd<p.end)return p;}return periodInfo(k,cut);}
function lunarYearFirstK(Y,cut){
  const k0=kOfJd(jdFromDate(1,2,Y));
  for(let k=k0-3;k<=k0+3;k++){const m1=jdToDate(nmDay(k)),lu=solar2lunar(m1.d,m1.m,m1.y);if(lu.y===Y&&lu.m===1&&!lu.leap)return k;}
  return k0;
}
function yearPeriods(Y,cut){const k0=lunarYearFirstK(Y,cut),out=[];for(let k=k0;k<k0+14;k++){const p=periodInfo(k,cut);if(p.ly!==Y)break;out.push(p);}return out;}
const dayKey=jd=>{const x=jdToDate(jd);return key(x.y,x.m,x.d);};
function calcPeriod(S,p,carryIn){
  const st=S.settings,n=p.n,shift=st.shift>0?st.shift:12;
  let worked=0,hours=0,ot=0;
  for(let jd=p.start;jd<p.end;jd++){const h=Number(S.days[dayKey(jd)])||0;hours+=h;if(h>0)worked++;ot+=Math.max(0,h-shift);}
  const off=n-worked,daily=st.salary/n;
  const base=Math.round(daily*worked);
  const meal=Math.round(st.meal-(st.deductMeal?st.meal/n*off:0));
  ot=r2(ot);const cum=r2(ot+carryIn);const otDays=Math.floor(cum/shift);
  const otPay=Math.round(otDays*daily);const carryOut=r2(cum-otDays*shift);
  return Object.assign({},p,{worked,off,hours,daily,base,meal,ot,carryIn,cum,otDays,otPay,carryOut,total:base+meal+otPay,entered:hours>0});
}
function calcAll(S,uptoK){
  const cut=S.settings.cutoff||24,out={};let carry=Number(S.settings.opening)||0;
  const k0=lunarYearFirstK(S.settings.startYear,cut);
  for(let k=k0;k<=Math.max(uptoK,k0);k++){const r=calcPeriod(S,periodInfo(k,cut),carry);out[k]=r;carry=r.carryOut;}
  return out;
}
/*ENDCORE*/

const SEED={"2026-11-01":0,"2026-11-02":12,"2026-11-03":12,"2026-11-04":12,"2026-11-05":12,"2026-11-06":12,"2026-11-07":12,"2026-11-08":12,"2026-11-09":12,"2026-11-10":12,"2026-11-11":12,"2026-11-12":12,"2026-11-13":12,"2026-11-14":12,"2026-11-15":12,"2026-11-16":12,"2026-11-17":12,"2026-11-18":12,"2026-11-19":12,"2026-11-20":12,"2026-11-21":12,"2026-11-22":12,"2026-11-23":12,"2026-11-24":12,"2026-11-25":12,"2026-11-26":12,"2026-11-27":12,"2026-11-28":12,"2026-11-29":12,"2026-11-30":12,"2026-12-01":12,"2026-12-02":12,"2026-12-03":12,"2026-12-04":12,"2026-12-05":12,"2026-12-06":12,"2026-12-07":12,"2026-12-08":12,"2026-12-09":12,"2026-12-10":12,"2026-12-11":12,"2026-12-12":12,"2026-12-13":12,"2026-12-14":12,"2026-12-15":12,"2026-12-16":12,"2026-12-17":12,"2026-12-18":12,"2026-12-19":12,"2026-12-20":12,"2026-12-21":12,"2026-12-22":12,"2026-12-23":12,"2026-12-24":12,"2026-12-25":12,"2026-12-26":12,"2026-12-27":12,"2026-12-28":12,"2026-12-29":12,"2026-12-30":12,"2026-12-31":12};
const KEY='chamcong-lc-v1';
const WD=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const money=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';
const hfmt=n=>String(r2(n)).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

const DEF=()=>({settings:{salary:10000000,meal:1500000,shift:12,startYear:2026,deductMeal:false,opening:0,cutoff:24},days:{},notes:{},updatedAt:0});
let S=null,fromSeed=false;
try{const raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw);}catch(e){}
if(!S||!S.settings||!S.days){S=DEF();S.days=Object.assign({},SEED);fromSeed=true;}
S.settings=Object.assign(DEF().settings,S.settings);S.notes=S.notes||{};

const todayJd=()=>{const t=new Date();return jdFromDate(t.getDate(),t.getMonth()+1,t.getFullYear());};
const kMin=()=>lunarYearFirstK(S.settings.startYear,S.settings.cutoff);
let view={tab:'log',k:0,ly:0,noteOpen:null};
function gotoK(k){view.k=Math.max(k,kMin());view.ly=periodInfo(view.k,S.settings.cutoff).ly;}
gotoK(periodOfJd(todayJd(),S.settings.cutoff).k);
const fmtD=x=>x.d+'/'+x.m,fmtDY=x=>x.d+'/'+x.m+'/'+x.y;
const rng=p=>fmtDY(p.sd)+' – '+fmtDY(p.ed);
const plabel=p=>'tháng '+p.lm+(p.leap?' nhuận':'')+' âm';
const CAN=['Canh','Tân','Nhâm','Quý','Giáp','Ất','Bính','Đinh','Mậu','Kỷ'],CHI=['Thân','Dậu','Tuất','Hợi','Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi'];

/* ---------- lưu trữ ---------- */
let dbRef=null,dbState='local',saveTimer=null;
function persist(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(pushDb,900);
  if(GH){clearTimeout(ghTimer);ghTimer=setTimeout(()=>ghSync(),2500);}
}
async function pushDb(){
  if(!dbRef)return;
  try{await dbRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt});dbState='ok';}catch(e){dbState='err';}
  if(view.tab==='set')render();
}
function adopt(o){
  S=o;S.settings=Object.assign(DEF().settings,S.settings);S.notes=S.notes||{};
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  try{gotoK(view.k);}catch(e){}
}
/* ---------- đồng bộ qua GitHub Gist (chỉ bản chạy độc lập, không phải bản trong Claude) ---------- */
const GH_KEY='chamcong-gh-v1',GH_DESC='cham-cong-ngoc-duy-data',GH_FILE='chamcong.json';
let GH=null,ghTimer=null,ghBusy=false,ghText='',ghLast=0;
try{GH=JSON.parse(localStorage.getItem(GH_KEY)||'null');}catch(e){}
if(window.claude)GH=null;
function ghSave(){try{if(GH)localStorage.setItem(GH_KEY,JSON.stringify(GH));else localStorage.removeItem(GH_KEY);}catch(e){}}
function setGhMsg(t){ghText=t;const el=$('#ghmsg');if(el)el.textContent=t;}
async function gh(path,opt){
  const o=opt||{};
  const r=await fetch('https://api.github.com'+path,{method:o.method||'GET',body:o.body,headers:Object.assign({'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json'},o.body?{'Content-Type':'application/json'}:{})});
  if(r.status===401)throw new Error('auth');
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
async function ghFindOrCreate(){
  const list=await gh('/gists?per_page=100');
  const f=list.find(g=>g.description===GH_DESC&&g.files&&g.files[GH_FILE]);
  if(f)return f.id;
  const c=await gh('/gists',{method:'POST',body:JSON.stringify({description:GH_DESC,public:false,files:{[GH_FILE]:{content:JSON.stringify(S)}}})});
  return c.id;
}
async function ghSync(){
  if(!GH||ghBusy)return;
  ghBusy=true;setGhMsg('Đang đồng bộ…');
  try{
    if(!GH.id){GH.id=await ghFindOrCreate();ghSave();}
    const g=await gh('/gists/'+GH.id);
    const file=g.files&&g.files[GH_FILE];
    let remote=null;
    if(file){
      let txt=file.content;
      if(file.truncated)txt=await (await fetch(file.raw_url)).text();
      try{remote=JSON.parse(txt);}catch(e){}
    }
    const ru=(remote&&remote.updatedAt)||0,lu=S.updatedAt||0;
    if(remote&&remote.days&&remote.settings&&ru>lu){
      adopt(remote);setGhMsg('Đã tải dữ liệu mới từ GitHub.');
      if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();
    }else if(lu>ru){
      await gh('/gists/'+GH.id,{method:'PATCH',body:JSON.stringify({files:{[GH_FILE]:{content:JSON.stringify(S)}}})});
      setGhMsg('Đã đẩy dữ liệu lên GitHub.');
    }else setGhMsg('Dữ liệu đã khớp trên các máy.');
    ghLast=Date.now();
  }catch(e){
    if(e.message==='auth'){setGhMsg('Mã truy cập sai hoặc đã hết hạn.');if(!GH.id){GH=null;ghSave();}}
    else setGhMsg('Không đồng bộ được, kiểm tra mạng rồi thử lại.');
  }
  ghBusy=false;
  if(view.tab==='set'){const t=ghText;render();setGhMsg(t);}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&GH&&Date.now()-ghLast>30000)ghSync();});
window.addEventListener('online',()=>{if(GH)ghSync();});

function withTimeout(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    const [user,db]=await Promise.all([withTimeout(claude.use('user'),10000),withTimeout(claude.use('db'),10000)]);
    if(!user||!db)return;
    const id=await user.id();if(!id)return;
    dbRef=db.collection('data/users/'+id).doc('chamcong');
    const snap=await dbRef.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){adopt(JSON.parse(d.json));dbState='ok';render();return;}
    }
    dbState='ok';
    await pushDb();
  }catch(e){dbState='err';}
  if(view.tab==='set')render();
}

function chipFor(h){

  if(!(h>0))return '<span class="chip off">Nghỉ</span>';
  if(h>shift)return '<span class="chip ot">+'+hfmt(h-shift)+'h tăng ca</span>';
  if(h===shift)return '<span class="chip ok">Đủ ca</span>';
  return '<span class="chip ok">Đi làm '+hfmt(h)+'h</span>';
}

function armConfirm(btn,label,fn){
  if(btn.dataset.armed){clearTimeout(confirmTimer[btn.id]);fn();return;}
  btn.dataset.armed='1';const old=btn.textContent;btn.textContent='Bấm lần nữa để xác nhận';

}
async function doExport(){
  const data=JSON.stringify(S,null,1),msg=$('#msg'),fn='cham-cong-sao-luu-'+new Date().toISOString().slice(0,10)+'.json';
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{const w=await C.Plugins.Filesystem.writeFile({path:fn,data,directory:'CACHE',encoding:'utf8'});
      await C.Plugins.Share.share({title:'Sao lưu chấm công',url:w.uri});msg.textContent='Đã mở bảng chia sẻ, chọn nơi lưu file.';return;}catch(e){}
  }
  if(!window.claude){
    try{const blob=new Blob([data],{type:'application/json'}),f=new File([blob],fn,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sao lưu chấm công'});msg.textContent='Đã mở bảng chia sẻ.';return;}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();msg.textContent='Đã tải file sao lưu.';return;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  try{
    const dl=await withTimeout(claude.use('downloads'),5000);
    if(dl){await dl.save({filename:fn,data});msg.textContent='Đã gửi file sao lưu.';return;}
  }catch(e){if(e&&e.code==='declined'){msg.textContent='Bạn đã từ chối lưu file.';return;}}
  $('#copyarea').innerHTML='<textarea class="copybox" id="copybox" readonly aria-label="Dữ liệu sao lưu"></textarea>';
  const ta=$('#copybox');ta.value=data;ta.select();
  try{await navigator.clipboard.writeText(data);msg.textContent='Đã chép dữ liệu sao lưu vào bộ nhớ tạm. Dán vào một ghi chú để giữ.';}
  catch(e){msg.textContent='Chọn toàn bộ nội dung trong khung bên dưới rồi chép lại để lưu.';}
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tabs button');
  if(tb){view.tab=tb.dataset.tab;view.noteOpen=null;render();window.scrollTo(0,0);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,row=b.closest('.row');
  if(act==='prev'||act==='next'){
    const nk=view.k+(act==='next'?1:-1);
    if(nk<kMin())return;
    gotoK(nk);view.noteOpen=null;render();return;
  }
  if(act==='pyear'){if(view.ly>S.settings.startYear){view.ly--;render();}return;}
  if(act==='nyear'){view.ly++;render();return;}
  if(act==='today'){gotoK(periodOfJd(todayJd(),S.settings.cutoff).k);view.noteOpen=null;render();
    const t=document.querySelector('.row.today');if(t)t.scrollIntoView({block:'center'});return;}
  if(act==='dec'||act==='inc'){
    const k=row.dataset.k,cur=S.days[k];let n;
    if(act==='inc')n=(cur===undefined||cur==='')?S.settings.shift:Math.min(24,Number(cur)+1);
    else n=(cur===undefined||cur==='')?0:Math.max(0,Number(cur)-1);
    setHours(k,n);row.querySelector('.hrs').value=n;refreshRow(row);return;
  }
  if(act==='note'){const k=row.dataset.k;view.noteOpen=view.noteOpen===k?null:k;
    const top=window.scrollY;render();window.scrollTo(0,top);focusNote();return;}
  if(act==='fill'){
    const p=periodInfo(view.k,S.settings.cutoff),lim=Math.min(p.end-1,todayJd());
    for(let jd=p.start;jd<=lim;jd++){const k=dayKey(jd);if(S.days[k]===undefined||S.days[k]==='')S.days[k]=S.settings.shift;}
    persist();const top=window.scrollY;render();window.scrollTo(0,top);return;
  }
  if(act==='clear'){armConfirm(b,'',()=>{const p=periodInfo(view.k,S.settings.cutoff);for(let jd=p.start;jd<p.end;jd++){const k=dayKey(jd);delete S.days[k];delete S.notes[k];}persist();render();});return;}
  if(act==='ghconnect'){const t=($('#gh-token').value||'').trim();if(!t){setGhMsg('Hãy dán mã truy cập vào ô trên.');return;}
    GH={token:t};ghSave();ghSync();return;}
  if(act==='ghsync'){ghSync();return;}
  if(act==='ghoff'){armConfirm(b,'',()=>{GH=null;ghSave();ghText='Đã ngắt kết nối. Dữ liệu trên GitHub vẫn còn.';render();});return;}
  if(act==='export'){doExport();return;}
  if(act==='reseed'){armConfirm(b,'',()=>{S.days=Object.assign({},SEED);S.notes={};persist();$('#msg').textContent='Đã nạp lại số giờ từ bảng Excel gốc.';delete b.dataset.armed;b.textContent='Nạp lại dữ liệu Excel gốc';});return;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('hrs')){
    const row=t.closest('.row');let v=t.value;
    if(v!==''){let n=parseFloat(v.replace(',','.'));if(isNaN(n)||n<0)n=0;if(n>24)n=24;v=n;}
    setHours(row.dataset.k,v);refreshRow(row);return;
  }
  if(t.classList.contains('notein')){
    const k=t.closest('.row').dataset.k;
    if(t.value.trim())S.notes[k]=t.value;else delete S.notes[k];
    persist();return;
  }
  const map={'s-salary':'salary','s-meal':'meal','s-shift':'shift','s-start':'startYear','s-open':'opening','s-cut':'cutoff'};
  if(map[t.id]){
    let n=parseFloat(t.value);if(isNaN(n))return;
    if(t.id==='s-shift'&&n<=0)return;
    if(t.id==='s-start'&&(n<2000||n>2100||n!==Math.round(n)))return;
    if(t.id==='s-cut'&&(n<1||n>29||n!==Math.round(n)))return;
    S.settings[map[t.id]]=n;persist();
    if(t.id==='s-start'||t.id==='s-cut')gotoK(view.k);
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='s-deduct'){S.settings.deductMeal=t.value==='1';persist();}
  if(t.id==='importfile'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      const msg=$('#msg');
      try{
        const o=JSON.parse(fr.result);
        if(!o||typeof o!=='object'||!o.days||!o.settings)throw new Error('bad');
        o.notes=o.notes||{};adopt(o);persist();
        gotoK(view.k);render();$('#msg').textContent='Đã khôi phục dữ liệu từ file.';
      }catch(err){msg.textContent='File không đúng định dạng sao lưu của app này.';}
    };
    fr.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('notein'))e.target.blur();});

render();
if(fromSeed){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
initDb();
if(GH)ghSync();
</script>
